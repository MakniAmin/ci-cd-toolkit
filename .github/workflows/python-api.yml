name: python-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'examples/python-api/**'
      - '.github/workflows/python-api.yml'
      - '.github/actions/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/lint-and-test
        with:
          working-directory: examples/python-api
          setup-command: pip install -r requirements.txt
          lint-command: flake8 . --max-line-length=100
          test-command: pytest

  build-scan-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build-scan-push
        with:
          image-name: makniamin/ci-cd-toolkit/python-api-demo
          context: examples/python-api
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger deploy hook
        run: curl -fsS -X POST "${{ secrets.PYTHON_API_DEPLOY_HOOK }}"
