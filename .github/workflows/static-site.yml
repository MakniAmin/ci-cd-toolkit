name: static-site CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'examples/static-site/**'
      - '.github/workflows/static-site.yml'
      - '.github/actions/**'

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build-scan-push
        with:
          image-name: ${{ github.repository }}/static-site-demo
          context: examples/static-site
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger deploy hook
        run: curl -fsS -X POST "${{ secrets.STATIC_SITE_DEPLOY_HOOK }}"
